{% extends "base.html" %}
{% load static %}

{% block title %}Profile{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-6">
      <div class="card shadow-sm text-center">
        <div class="card-body p-4">
          <!-- Avatar -->
          <img
            src="{{ user.profile.profile_image.url }}"
            alt="Profile"
            width="140" height="140"
            class="rounded-circle shadow-sm mb-3"
            style="object-fit:cover"
            
          />

          <h2 class="h4 mb-1">{{ user.username }}</h2>
          <p class="text-muted mb-1">{{ user.email }}</p>
          <p class="text-muted">Joined: {{ user.profile.date_joined|date:"Y-m-d" }}</p>

          <div class="d-flex justify-content-center gap-2 mt-3">
            <a href="{% url 'accounts:edit_profile' %}" class="btn btn-outline-primary">
              Edit Profile
            </a>
            <a href="{% url 'accounts:logout' %}" class="btn btn-outline-secondary">
              Logout
            </a>
          </div>
        </div>
      </div>

      <div class="text-center mt-3">
        <small class="text-muted">Keep your profile info up to date.</small>
      </div>
    </div>
  </div>
</div>
{% endblock %}
